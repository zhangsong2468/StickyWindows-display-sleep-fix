name: Build local patches

# Build of the local patches, for personal use: signed with the repository's own self-signed certificate
# (ad-hoc without it), not notarized. A push that raises the version in build-local.sh also publishes a
# release with the Sparkle appcast the app updates from. See LOCAL-FIX.md.
on:
  push:
    branches: [display-sleep-fix]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS 26 image: Xcode 26 or newer is needed for the Icon Composer app icon.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Import signing certificate
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$SIGNING_P12_BASE64" ]; then
            echo "No signing certificate; the build will be ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -P "$SIGNING_P12_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          # codesign only finds identities in keychains on the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          # Self-signed, so it never counts as a "valid" identity; codesign takes it by hash all the same.
          identity="$(security find-certificate -c 'Sticky Windows Local Signing' -Z "$keychain" | awk '/SHA-1 hash:/ { print $3 }')"
          test -n "$identity"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and package
        run: bash build-local.sh

      - name: Inspect
        id: meta
        run: |
          app="build/Build/Products/Release/Sticky Windows.app"
          lipo -archs "$app/Contents/MacOS/Sticky Windows"
          codesign -dv --verbose=2 "$app" 2>&1
          codesign -d -r- "$app" 2>&1
          plist="$app/Contents/Info.plist"
          echo "version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" >> "$GITHUB_OUTPUT"
          echo "build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" >> "$GITHUB_OUTPUT"
          echo "minimum=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist" 2>/dev/null || echo 15.0)" >> "$GITHUB_OUTPUT"

      - name: Disk image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          stage="$RUNNER_TEMP/dmg"
          mkdir "$stage"
          ditto "build/Build/Products/Release/Sticky Windows.app" "$stage/Sticky Windows.app"
          ln -s /Applications "$stage/Applications"
          # hdiutil now and then fails with "Resource busy" on hosted runners.
          for attempt in 1 2 3; do
            hdiutil create -volname "Sticky Windows" -srcfolder "$stage" -format UDZO -ov "dist/StickyWindows-$VERSION.dmg" && break
            test "$attempt" -lt 3
            sleep 5
          done

      - name: Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
          MINIMUM: ${{ steps.meta.outputs.minimum }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "No update signing key; skipping the appcast."
            exit 0
          fi
          sign_update="$(find build/SourcePackages/artifacts -name sign_update -type f | head -1)"
          test -x "$sign_update"
          archive="StickyWindows-$VERSION.zip"
          # Prints: sparkle:edSignature="…" length="…"
          signature="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sign_update" --ed-key-file - "dist/$archive")"
          test -n "$signature"
          cat > dist/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Sticky Windows (local build)</title>
              <item>
                <title>$VERSION</title>
                <pubDate>$(date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>$BUILD</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>$MINIMUM</sparkle:minimumSystemVersion>
                <enclosure url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$archive" type="application/octet-stream" $signature/>
              </item>
            </channel>
          </rss>
          EOF
          cat dist/appcast.xml
          shasum -a 256 dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: StickyWindows-${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
        run: |
          if [ ! -f dist/appcast.xml ] || [ -z "${SIGN_IDENTITY:-}" ]; then
            echo "Unsigned build; not publishing."
            exit 0
          fi
          tag="v$VERSION"
          # A version is published once; later pushes that don't raise it only leave the run artifact.
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; not republishing."
            exit 0
          fi
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Sticky Windows $VERSION (local build $BUILD)" \
            --notes "Unofficial build of [aaronfisher/StickyWindows](https://github.com/aaronfisher/StickyWindows) 0.5.0 with local patches (see LOCAL-FIX.md), for noncommercial use under the upstream [license](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/LICENSE). Self-signed and not notarized: on first launch, right-click the app and choose Open, then grant Accessibility access." \
            "dist/StickyWindows-$VERSION.dmg" "dist/StickyWindows-$VERSION.zip" dist/appcast.xml
