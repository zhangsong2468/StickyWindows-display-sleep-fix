name: Build display-sleep fix

# Unsigned (ad-hoc) build of the local display-sleep patch, for personal use. No signing or notary
# secrets needed; the .zip is attached to the run as an artifact. See LOCAL-FIX.md.
on:
  push:
    branches: [display-sleep-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # macOS 26 image: Xcode 26 is needed for the Icon Composer app icon.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build and package
        run: bash build-local.sh

      - name: Checksum
        run: shasum -a 256 dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: StickyWindows-0.5.0-display-sleep-fix
          path: dist/*.zip
          if-no-files-found: error
